<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilyDesk">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<title>FamilyDesk</title>
<style>
  :root {
    --fundo: #f2f2f7; --cartao: #ffffff; --texto: #1c1c1e; --suave: #6e6e73; --linha: #e5e5ea;
    --azul: #0a84ff; --verde: #30a14e; --laranja: #c27c0e; --roxo: #8250df; --vermelho: #d1242f;
    --chip-fundo: #e9eef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0d1117; --cartao: #161b22; --texto: #e6edf3; --suave: #8b949e; --linha: #21262d;
      --azul: #58a6ff; --verde: #3fb950; --laranja: #d29922; --roxo: #a371f7; --vermelho: #f85149;
      --chip-fundo: #1f2a3a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px);
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 30px; font-weight: 700; margin: 4px 0 0; letter-spacing: -0.5px; }
  .sub { color: var(--suave); font-size: 15px; margin-bottom: 14px; }
  .cartao { background: var(--cartao); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .cartao h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--suave); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .vazio { color: var(--suave); font-style: italic; font-size: 15px; }

  /* Frase do dia */
  .frase { font-style: italic; color: var(--suave); font-size: 15px; margin: -6px 0 14px; }
  .frase:empty { display: none; }
  .frase small { display: block; font-style: normal; font-size: 12px; margin-top: 2px; }

  /* Tempo agora */
  .agora { display: flex; align-items: center; gap: 12px; }
  .agora .ic { font-size: 54px; line-height: 1; }
  .agora .t { font-size: 56px; font-weight: 200; line-height: 1; }
  .agora .d { font-size: 17px; }
  .agora .d small { display: block; color: var(--suave); font-size: 14px; }
  .detalhes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; margin-top: 12px; font-size: 14px; color: var(--suave); }
  .detalhes b { color: var(--texto); font-weight: 500; }
  .detalhes span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chips:empty { display: none; }
  .alerta { font-size: 14px; padding: 6px 11px; border-radius: 14px; background: var(--chip-fundo); }
  .alerta.yellow { background: #d29922; color: #111; } .alerta.orange { background: #f0883e; color: #111; } .alerta.red { background: #f85149; color: #fff; }

  /* Horas */
  .horas { display: flex; overflow-x: auto; gap: 4px; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
  .horas::-webkit-scrollbar { display: none; }
  .hr { flex: 0 0 52px; text-align: center; }
  .hr .h { font-size: 13px; color: var(--suave); } .hr .i { font-size: 24px; line-height: 32px; } .hr .tt { font-size: 17px; }
  .hr .c { font-size: 11px; color: var(--azul); height: 14px; }

  /* Dias */
  .dia { display: grid; grid-template-columns: 70px 30px 46px minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--linha); font-size: 16px; }
  .dia:first-of-type { border-top: 0; }
  .dia .ic { font-size: 22px; text-align: center; }
  .dia .ch { font-size: 12px; color: var(--azul); }
  .barra { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .barra .min { color: var(--suave); width: 28px; text-align: right; }
  .barra .trilho { flex: 1; height: 5px; border-radius: 3px; background: var(--linha); position: relative; }
  .barra .enchido { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #58a6ff, #d29922); }
  .barra .max { width: 28px; }

  /* Listas */
  .grupo { font-size: 14px; font-weight: 600; color: var(--suave); margin: 12px 0 2px; }
  .grupo:first-of-type { margin-top: 0; }
  .grupo.hoje { color: var(--azul); }
  .grupo .motivo { font-weight: 400; color: var(--roxo); }
  .linha { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
  .linha:last-child { border-bottom: 0; }
  .linha .cor { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .linha .h { width: 44px; flex: none; color: var(--suave); font-size: 15px; font-variant-numeric: tabular-nums; }
  .linha .o { flex: 1; min-width: 0; }
  .linha .o small { display: block; color: var(--suave); font-size: 13px; }
  .linha .lv { display: block; color: var(--laranja); font-size: 13px; }
  .linha .f { color: var(--suave); font-size: 14px; white-space: nowrap; }
  .linha.breve .f { color: var(--laranja); } .linha.hoje .f { color: #f778ba; font-weight: 600; }
  .chip { display: inline-block; font-size: 12px; line-height: 16px; padding: 0 6px; border: 1px solid; border-radius: 9px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }

  /* Escola */
  .abas { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .aba { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--linha); background: none; color: var(--texto); }
  .aba.ativa { color: #fff; border-color: transparent; }
  .tempo { display: flex; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; font-size: 15px; }
  .tempo .h { width: 92px; flex: none; color: var(--suave); font-variant-numeric: tabular-nums; font-size: 14px; }
  .tempo.pausa { color: var(--suave); font-style: italic; font-size: 13px; padding-top: 2px; padding-bottom: 2px; }
  .tempo.agora { background: var(--chip-fundo); font-weight: 600; }
  .tempo .aec { font-size: 11px; color: var(--roxo); border: 1px solid var(--roxo); border-radius: 8px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
  .nota-escola { font-size: 12px; color: var(--suave); margin-top: 8px; }

  /* Trânsito */
  .rota { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linha); color: inherit; text-decoration: none; }
  .rota:last-child { border-bottom: 0; }
  .rota .ic { font-size: 20px; width: 26px; text-align: center; }
  .rota .ic img { width: 26px; height: 26px; border-radius: 6px; vertical-align: middle; }
  .rota .o { flex: 1; min-width: 0; }
  .rota .o small { display: block; color: var(--suave); font-size: 13px; }
  .rota .m { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .rota .m small { display: block; font-size: 12px; font-weight: 400; color: var(--vermelho); }
  .rota.ok .m { color: var(--verde); } .rota.lento .m { color: var(--laranja); } .rota.mau .m { color: var(--vermelho); }
  .rota .seta { color: var(--suave); font-size: 18px; }

  /* Prazos */
  .prazo { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .prazo:last-child { border-bottom: 0; }
  .prazo .o { flex: 1; min-width: 0; }
  .prazo .o small { display: block; color: var(--suave); font-size: 13px; }
  .prazo.breve .o small { color: var(--laranja); }
  .prazo.atrasado .o, .prazo.atrasado .o small { color: var(--vermelho); }
  .feito { font: inherit; font-size: 13px; border: 1px solid var(--verde); color: var(--verde); background: none; border-radius: 14px; padding: 4px 10px; white-space: nowrap; }

  /* Finanças */
  .btn-ver { font: inherit; font-size: 14px; color: var(--azul); background: none; border: 0; padding: 0; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .total { font-size: 34px; font-weight: 300; margin: 2px 0 8px; }
  .neg { color: var(--vermelho); }
  .oculto { filter: blur(9px); user-select: none; }

  /* Barra inferior */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
    padding: 8px 8px calc(env(safe-area-inset-bottom) + 6px);
    background: color-mix(in srgb, var(--cartao) 85%, transparent);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--linha);
  }
  nav a { color: var(--suave); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
  nav a span { font-size: 22px; }
  nav a.ativo { color: var(--azul); }
  #estado { text-align: center; color: var(--suave); font-size: 12px; margin-top: -4px; }
</style>
</head>
<body>
  <h1 id="ola">Olá</h1>
  <div class="sub" id="data">&nbsp;</div>
  <div id="frase" class="frase"></div>

  <div class="cartao" id="c-agora"><div class="vazio">A carregar…</div></div>
  <div class="chips" id="chips"></div>

  <div class="cartao" id="c-escola" hidden><h2 id="escola-titulo">Escola</h2><div id="escola"></div></div>
  <div class="cartao" id="c-transito" hidden><h2>🚗 Trânsito <span id="transito-info" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2><div id="transito"></div></div>
  <div class="cartao"><h2>Próximas horas</h2><div class="horas" id="horas"></div></div>
  <div class="cartao"><h2>Próximos 7 dias</h2><div id="dias"></div></div>
  <div class="cartao"><h2>Agenda</h2><div id="agenda"></div></div>
  <div class="cartao"><h2>Atividades</h2><div id="atividades"></div></div>
  <div class="cartao" id="c-prazos" hidden><h2>📋 Prazos <a href="/gerir#prazos" style="color:var(--azul);text-transform:none;letter-spacing:0;font-weight:400;text-decoration:none">gerir ›</a></h2><div id="prazos"></div></div>
  <div class="cartao"><h2>Aniversários</h2><div id="aniversarios"></div></div>
  <div class="cartao" id="c-financas" hidden>
    <h2>💶 Finanças <button class="btn-ver" id="ver-fin">Mostrar</button></h2>
    <div id="financas" class="oculto"></div>
  </div>
  <div id="estado"></div>

  <nav>
    <a href="/iphone" class="ativo"><span>🏠</span>Resumo</a>
    <a href="/gerir#eventos"><span>✏️</span>Gerir</a>
    <a href="/gerir#ical"><span>📅</span>Calendário</a>
    <a href="#" id="atualizar"><span>🔄</span>Atualizar</a>
  </nav>

<script src="comum.js"></script>
<script>
const C = window.Comum;
const { DIAS, DIAS_CURTOS, MESES, MESES_CURTOS, tempo, esc, chip, chaveDia, deChave, hhmm, nomeDia, euros } = C;
const $ = id => document.getElementById(id);

function saudacao(h) { return h < 6 ? 'Boa noite' : h < 13 ? 'Bom dia' : h < 20 ? 'Boa tarde' : 'Boa noite'; }

function desenharAgora(m, contagens) {
  const a = new Date();
  $('ola').textContent = saudacao(a.getHours());
  $('data').textContent = `${DIAS[a.getDay()]}, ${a.getDate()} de ${MESES[a.getMonth()]}`;

  let chips = (contagens || []).map(c => `<span class="alerta">${c.icone} ${esc(c.texto)}</span>`).join('');
  if (!m || m.erro) {
    $('c-agora').innerHTML = '<div class="vazio">Sem meteorologia</div>';
    $('chips').innerHTML = chips;
    return;
  }
  const at = m.atual, hoje = m.dias[0] || {}, t = tempo(at.codigo);
  $('c-agora').innerHTML = `
    <div class="agora"><span class="ic">${at.dia ? t[0] : t[1]}</span><span class="t">${at.temp}°</span>
      <span class="d">${esc(t[2])}<small>${esc(m.local)} · máx ${hoje.max}° mín ${hoje.min}°</small></span></div>
    <div class="detalhes">
      <span>🌡 Sensação <b>${at.sensacao}°</b></span><span>💧 Humidade <b>${at.humidade}%</b></span>
      <span>💨 <b>${at.vento} km/h ${C.direcaoVento(at.direcao)}</b> · raj. ${at.rajada}</span><span>☀️ UV <b>${Math.round(at.uv)}</b> ${C.nivelUV(at.uv)}</span>
      <span>🌅 <b>${hoje.nascer}</b> · 🌇 <b>${hoje.por}</b></span>
      ${m.ar && m.ar.aqi != null ? `<span>🍃 Ar <b>${C.nivelAr(m.ar.aqi)}</b>${m.ar.polen ? ' · pólen ' + C.nivelPolen(m.ar.polen.valor) : ''}</span>` : ''}
    </div>`;

  chips += (m.avisos || []).map(w => { const f = new Date(w.fim);
    return `<span class="alerta ${esc(w.nivel)}">⚠️ Aviso ${C.NIVEL_AVISO[w.nivel] || ''}: ${esc(w.tipo)} até ${DIAS_CURTOS[f.getDay()]} ${hhmm(f)}</span>`; }).join('');
  chips += C.dicasTempo(m).map(d => `<span class="alerta">${d}</span>`).join('');
  $('chips').innerHTML = chips;

  $('horas').innerHTML = m.horas.filter((_, i) => i % 2 === 0).map((h, i) => `<div class="hr"><div class="h">${i === 0 ? 'Agora' : C.pad(h.hora) + 'h'}</div>
    <div class="i">${tempo(h.codigo)[h.dia ? 0 : 1]}</div><div class="tt">${h.temp}°</div><div class="c">${h.chuva >= 10 ? h.chuva + '%' : ''}</div></div>`).join('');

  // barras de temperatura à escala dos 5 dias (como na app Tempo)
  const lo = Math.min(...m.dias.map(d => d.min)), hi = Math.max(...m.dias.map(d => d.max)), amp = Math.max(1, hi - lo);
  const hojeK = chaveDia(new Date());
  $('dias').innerHTML = m.dias.map(d => { const dt = deChave(d.dia);
    return `<div class="dia"><span>${d.dia === hojeK ? 'Hoje' : DIAS_CURTOS[dt.getDay()] + ' ' + dt.getDate()}</span>
      <span class="ic">${tempo(d.codigo)[0]}</span><span class="ch">${d.chuva > 0 ? '💧' + d.chuva + '%' : ''}</span>
      <span class="barra"><span class="min">${d.min}°</span><span class="trilho"><span class="enchido" style="left:${(d.min - lo) / amp * 100}%;right:${(hi - d.max) / amp * 100}%"></span></span><span class="max">${d.max}°</span></span></div>`;
  }).join('');
}

function desenharAgenda(eventos) {
  const agora = Date.now(), hoje = new Date();
  const hojeK = chaveDia(hoje), amanhaK = chaveDia(new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 1));
  let html = '', dia = null;
  for (const e of eventos) {
    if (!e.diaInteiro && e.fim < agora) continue;
    if (e.dia !== dia) { dia = e.dia; html += `<div class="grupo${e.dia === hojeK ? ' hoje' : ''}">${nomeDia(e.dia, hojeK, amanhaK)}</div>`; }
    const ic = e.tipo ? (C.ICONE_TIPO[e.tipo] || '') + ' ' : '';
    html += `<div class="linha"><span class="cor" style="background:${esc(e.cor || '#58a6ff')}"></span>
      <span class="h">${e.diaInteiro ? 'dia' : hhmm(new Date(e.inicio))}</span>
      <span class="o">${ic}${esc(e.titulo)}${e.quem ? chip(e.quem, e.cor) : ''}${e.local || e.notas ? `<small>${esc([e.local, e.notas].filter(Boolean).join(' · '))}</small>` : ''}</span></div>`;
  }
  $('agenda').innerHTML = html || '<div class="vazio">Sem compromissos nos próximos dias</div>';
}

function desenharAtividades(lista, dias, escolaDias) {
  let html = '';
  dias.forEach((info, off) => {
    const doDia = lista.filter(a => a.dia === info.dia);
    const esc_ = off <= 1 ? escolaDias.filter(e => e.dia === info.dia) : [];
    if (!doDia.length && !esc_.length && off > 0 && !info.pausadas) return;
    const d = deChave(info.dia);
    const motivo = info.feriado ? '🇵🇹 ' + info.feriado : info.interrupcao || '';
    html += `<div class="grupo${off === 0 ? ' hoje' : ''}">${off === 0 ? 'Hoje' : off === 1 ? 'Amanhã' : DIAS[d.getDay()]}${motivo ? ` <span class="motivo">· ${esc(motivo)}</span>` : ''}</div>`;
    html += esc_.map(e => `<div class="linha"><span class="cor" style="background:${esc(e.cor)}"></span><span class="h">${esc(e.entrada)}</span>
      <span class="o">🏫 Escola até ${esc(e.aec ? e.saidaSemAec || e.saida : e.saida)}${chip(e.quem, e.cor)}${e.aec || e.levar ? `<span class="lv">${esc([e.aec && 'AEC ' + e.aec + ' até ' + e.saida, e.levar && '🎒 ' + e.levar].filter(Boolean).join(' · '))}</span>` : ''}</span></div>`).join('');
    if (!doDia.length && !esc_.length) html += `<div class="vazio">${info.pausadas ? `Sem atividades (${info.pausadas} em pausa)` : 'Sem atividades'}</div>`;
    html += doDia.map(a => `<div class="linha"><span class="cor" style="background:${esc(a.cor)}"></span><span class="h">${esc(a.inicio)}</span>
      <span class="o">${esc(a.atividade)}${chip(a.quem, a.cor)}${a.local ? `<small>${esc(a.local)}</small>` : ''}${a.levar && off <= 1 ? `<span class="lv">🎒 ${esc(a.levar)}</span>` : ''}</span></div>`).join('');
  });
  $('atividades').innerHTML = html;
}

// Horário do dia: hoje se houver aulas, senão o próximo dia de aulas. Abas por filho.
let filhoEscola = null;
function desenharEscola(escolaDias) {
  const quem = [...new Set(escolaDias.map(e => e.quem))];
  $('c-escola').hidden = !quem.length;
  if (!quem.length) return;
  if (!quem.includes(filhoEscola)) filhoEscola = quem[0];
  const e = escolaDias.find(x => x.quem === filhoEscola);
  const hojeK = chaveDia(new Date()), d = deChave(e.dia);
  const amanha = chaveDia(new Date(Date.now() + 864e5));
  $('escola-titulo').textContent = '🏫 Escola · ' + (e.dia === hojeK ? 'hoje' : e.dia === amanha ? 'amanhã' : DIAS[d.getDay()].toLowerCase());
  const agora = hhmm(new Date());
  const abas = quem.length > 1 ? '<div class="abas">' + quem.map(q => { const c = escolaDias.find(x => x.quem === q).cor;
    return `<button class="aba${q === filhoEscola ? ' ativa' : ''}" style="${q === filhoEscola ? 'background:' + esc(c) : 'color:' + esc(c)}" data-quem="${esc(q)}">${esc(q)}</button>`; }).join('') + '</div>' : '';
  $('escola').innerHTML = abas + e.tempos.filter(t => t.pausa || t.disciplina).map(t => {
    const atual = e.dia === hojeK && agora >= t.inicio && agora < t.fim;
    return t.pausa
      ? `<div class="tempo pausa${atual ? ' agora' : ''}"><span class="h">${t.inicio}–${t.fim}</span>${esc(t.pausa)}</div>`
      : `<div class="tempo${atual ? ' agora' : ''}"><span class="h">${t.inicio}–${t.fim}</span><span>${esc(t.disciplina)}${t.aec ? '<span class="aec">AEC</span>' : ''}</span></div>`;
  }).join('') + (e.levar ? `<div class="nota-escola" style="color:var(--laranja)">🎒 ${esc(e.levar)}</div>` : '') + (e.escola ? `<div class="nota-escola">${esc(e.escola)}</div>` : '');
  $('escola').querySelectorAll('.aba').forEach(b => b.onclick = () => { filhoEscola = b.dataset.quem; desenharEscola(escolaDias); });
}

function desenharTransito(t) {
  $('c-transito').hidden = !(t && t.rotas && t.rotas.length);
  if ($('c-transito').hidden) return;
  $('transito-info').textContent = (t.comTransito ? '' : 'sem trânsito · ') + hhmm(new Date(t.atualizado));
  $('transito').innerHTML = t.rotas.map(r => r.erro
    ? `<div class="rota"><span class="ic">${esc(r.icone)}</span><span class="o">${esc(r.nome)}<small>sem rota</small></span></div>`
    : `<a class="rota ${esc(r.estado)}" href="${esc(r.link)}" target="_blank" rel="noopener"><span class="ic">${r.logo ? `<img src="${esc(r.logo)}" alt="">` : esc(r.icone)}</span>
        <span class="o">${esc(r.nome)}<small>${r.km} km · chegada às ${r.chegada}${t.comTransito ? ' · normal ' + r.normal + ' min' : ''}</small></span>
        <span class="m">${r.minutos} min${r.atraso >= 3 ? `<small>+${r.atraso} min</small>` : ''}</span><span class="seta">›</span></a>`).join('');
}

function desenharPrazos(lista) {
  $('c-prazos').hidden = !lista.length;
  $('prazos').innerHTML = lista.map(p => { const dt = deChave(p.data);
    const quando = p.atrasado ? `atrasado há ${-p.faltam} dias` : p.faltam === 0 ? 'hoje' : p.faltam === 1 ? 'amanhã' : `${dt.getDate()} ${MESES_CURTOS[dt.getMonth()]} · daqui a ${p.faltam} dias`;
    return `<div class="prazo${p.atrasado ? ' atrasado' : p.faltam <= 7 ? ' breve' : ''}"><span>${p.icone}</span>
      <span class="o">${esc(p.titulo)}${p.quem ? chip(p.quem, p.cor) : ''}<small>${quando}${p.notas ? ' · ' + esc(p.notas) : ''}</small></span>
      <button class="feito" data-id="${esc(p.id)}">✓ Feito</button></div>`;
  }).join('');
  $('prazos').querySelectorAll('.feito').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    const r = await fetch('/api/prazos/' + encodeURIComponent(b.dataset.id) + '/feito', { method: 'POST', headers: { 'X-Pin': localStorage.getItem('pin') || '' } });
    if (r.status === 401) { const pin = prompt('PIN de gestão:'); if (pin != null) localStorage.setItem('pin', pin); }
    atualizar();
  });
}

function desenharAniversarios(lista) {
  $('aniversarios').innerHTML = lista.map(a => { const dt = deChave(a.dia);
    const quando = a.faltam === 0 ? '🎉 hoje!' : a.faltam === 1 ? 'amanhã' : `${dt.getDate()} ${MESES_CURTOS[dt.getMonth()]} · ${a.faltam} dias`;
    return `<div class="linha${a.faltam === 0 ? ' hoje' : a.faltam <= 7 ? ' breve' : ''}"><span class="o">🎂 ${esc(a.nome)}${a.idade ? ` (${a.idade})` : ''}${chip(a.quem, a.cor)}</span><span class="f">${quando}</span></div>`;
  }).join('') || '<div class="vazio">Nenhum nos próximos dias</div>';
}

// Finanças: escondidas (desfocadas) até tocar em "Mostrar"; voltam a esconder-se após 60 s
let finTimer;
function desenharFinancas(fin) {
  $('c-financas').hidden = !fin;
  if (!fin) return;
  $('financas').innerHTML = `<div class="total${fin.total < 0 ? ' neg' : ''}">${euros(fin.total)}</div>` +
    fin.contas.map(c => `<div class="linha"><span class="o">${esc(c.nome)}${c.atualizado ? `<small>atualizado ${deChave(c.atualizado).getDate()} ${MESES_CURTOS[deChave(c.atualizado).getMonth()]}</small>` : ''}</span><span class="${c.saldo < 0 ? 'neg' : ''}">${euros(c.saldo)}</span></div>`).join('') +
    (fin.pagamentos.length ? `<div class="grupo">Próximos pagamentos · ${euros(fin.totalPagamentos)}</div>` +
      fin.pagamentos.map(p => { const dt = deChave(p.dia);
        return `<div class="linha${p.faltam <= 3 ? ' breve' : ''}"><span class="h">${p.faltam === 0 ? 'hoje' : p.faltam === 1 ? 'amanhã' : dt.getDate() + ' ' + MESES_CURTOS[dt.getMonth()]}</span><span class="o">${esc(p.descricao)}</span><span>${euros(p.valor)}</span></div>`; }).join('') : '');
}
function esconderFin() { $('financas').classList.add('oculto'); $('ver-fin').textContent = 'Mostrar'; }
$('ver-fin').onclick = () => {
  const oculto = $('financas').classList.toggle('oculto');
  $('ver-fin').textContent = oculto ? 'Mostrar' : 'Esconder';
  clearTimeout(finTimer);
  if (!oculto) finTimer = setTimeout(esconderFin, 60000);
};

let versao = null;
async function atualizar() {
  $('estado').textContent = 'A atualizar…';
  try {
    const d = await (await fetch('/api/dashboard', { cache: 'no-store' })).json();
    if (versao && d.versao && d.versao !== versao) return location.reload();
    versao = d.versao;
    desenharAgora(d.meteo, d.familia.contagens);
    desenharAgenda(d.agenda || []);
    desenharAtividades(d.familia.atividades || [], d.familia.dias || [], d.familia.escola || []);
    desenharEscola(d.familia.escola || []);
    desenharTransito(d.transito);
    $('frase').innerHTML = d.frase && d.frase.texto ? `“${esc(d.frase.texto)}”<small>${d.frase.autor ? '— ' + esc(d.frase.autor) : ''}${d.frase.fonte === 'zenquotes' ? ' · zenquotes.io' : ''}</small>` : '';
    desenharPrazos(d.familia.prazos || []);
    desenharAniversarios(d.familia.aniversarios || []);
    desenharFinancas(d.familia.financas);
    $('estado').textContent = 'Atualizado às ' + hhmm(new Date());
  } catch (e) {
    $('estado').textContent = 'Sem ligação ao servidor. Estás no Wi-Fi de casa?';
  }
}

$('atualizar').onclick = ev => { ev.preventDefault(); atualizar(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizar(); else esconderFin(); });
setInterval(atualizar, 2 * 60 * 1000);
atualizar();
</script>
</body>
</html>
